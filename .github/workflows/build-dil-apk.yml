name: Build Dil Kulübü APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'dil-app/**'
      - '.github/workflows/build-dil-apk.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dil-app/package-lock.json

      - name: Install Dependencies
        working-directory: dil-app
        run: npm ci || npm install

      - name: Build Web Application
        working-directory: dil-app
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: dil-app
        run: npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        working-directory: dil-app/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: dil-app/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DilKulubu-5Sinif-Debug-APK
          path: dil-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.0
          name: "Dil Kulübü 5 - v1.1.0 (Otomatik APK Dağıtımı)"
          body: |
            🎓 **Dil Kulübü 5 (İngilizce & Almanca) Mobil APK**
            
            ### 🌟 Bu Sürümdeki Yenilikler (v1.1.0)
            - 🇩🇪 **Almanca Müfredatı Genişletildi:** 4 Ünite, 12 Konu (Okul, Sayılar, Aile, Hobiler, Yiyecekler)
            - 🔤 **Kelime Dünyası Tamamlandı:** 12 Kategoride 120 Sesli ve Örnek Cümleli Kelime Kartı
            - 🔄 **Uygulama İçi Güncelleme:** GitHub Releases üzerinden tek tıkla APK güncelleme ve Canlı İçerik (OTA) senkronizasyonu
            - 🗣️ **Yerel Donanımsal Ses:** Cihazın yerel ses motoruyla tam uyumlu net telaffuz
          files: dil-app/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
