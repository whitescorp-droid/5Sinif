name: Build Dil Kulübü APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'dil-app/**'
      - '.github/workflows/build-dil-apk.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dil-app/package-lock.json

      - name: Install Dependencies
        working-directory: dil-app
        run: npm ci || npm install

      - name: Build Web Application
        working-directory: dil-app
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: dil-app
        run: npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        working-directory: dil-app/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: dil-app/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DilKulubu-5Sinif-Debug-APK
          path: dil-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Extract App Version
        id: app_version
        run: |
          VERSION=$(node -p "require('./dil-app/package.json').version")
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: "Dil Kulübü 5 - ${{ steps.app_version.outputs.tag }} (Oxford Word Skills & Otomatik APK Dağıtımı)"
          body: |
            🎓 **Dil Kulübü 5 (İngilizce, Oxford Word Skills & Almanca) Mobil APK**
            
            ### 🌟 Bu Sürümdeki Yenilikler (${{ steps.app_version.outputs.tag }})
            - 📚 **Oxford Word Skills (Elementary) Entegre Edildi:** 80 tematik ünite, orijinal kitap çizimleri, Spotlight kuralları ve cevap anahtarlı etkinlikler!
            - 🖼️ **Görsel Konu Panoları:** Sınıf eşyaları, insan anatomisi, günlük rutinler, giysiler, meyve/sebze, ulaşım ve mutfak eşyaları.
            - 🗣️ **Sesli Telaffuz & 3D Kartlar:** Tüm yeni Oxford kelimeleri için sesli okuma ve interaktif çalışma kartları.
            - ⚡ **Hızlı D/Y, Eşleştirme & Quiz:** Resmi Answer Key ile doğrulanmış soru setleri.
            - 🔄 **Uygulama İçi Güncelleme:** Otomatik sürüm denetimi ve APK indirme.
          files: dil-app/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
