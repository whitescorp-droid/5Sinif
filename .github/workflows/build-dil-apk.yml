name: Build Dil Kulübü APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'dil-app/**'
      - '.github/workflows/build-dil-apk.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dil-app/package-lock.json

      - name: Install Dependencies
        working-directory: dil-app
        run: npm ci || npm install

      - name: Build Web Application
        working-directory: dil-app
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: dil-app
        run: npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        working-directory: dil-app/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: dil-app/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DilKulubu-5Sinif-Debug-APK
          path: dil-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
